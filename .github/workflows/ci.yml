name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel superseded pull requests. Push to main is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: static checks
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run static checks
        run: bun scripts/check-all.ts --group static

  e2e:
    name: tests
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun scripts/check-all.ts --group e2e

  ui:
    name: ui flows
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Obscura
        uses: actions/cache@v4
        with:
          path: packages/web-app/.engine
          key: ${{ runner.os }}-obscura-v0.2.6

      - name: Fetch Obscura
        run: bun packages/web-app/scripts/fetch-obscura.ts

      - name: Install Playwright OS deps
        run: bunx playwright install-deps

      - name: Run UI flow tests
        env:
          CADMUS_TEST_ENGINE: obscura
          CADMUS_TEST_OBSCURA: ${{ github.workspace }}/packages/web-app/.engine/obscura
          CADMUS_COVERAGE: "1"
        run: bun scripts/check-all.ts --group ui

      # Failed attempts only: a test that failed and passed on retry is still
      # reported as flaky, and this keeps its first-attempt trace. Traces hold
      # request and response bodies from the test run, which uses only the
      # dev values in wrangler.jsonc. This job has no repository secrets.
      - name: Upload traces of failed UI attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failed-attempt-traces
          path: |
            packages/web-app/test-results/**/trace.zip
            packages/web-app/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

  ui-chrome-tabs:
    name: ui flows (real Chrome, cross-tab sessions)
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Run from the package so bunx uses the locked Playwright version; at the
      # repo root it fetches the latest one, whose browser build does not match.
      - name: Install Chromium for Playwright
        working-directory: packages/web-app
        run: bunx playwright install --with-deps chromium

      # Obscura does not deliver BroadcastChannel across pages, so the
      # cross-tab session specs run here on real Chromium. The probe fails the
      # run (never skips) if cross-page messaging does not work. The native
      # beforeunload spec also runs here: it needs real Chromium dialogs and
      # skips itself on other engines.
      - name: Run cross-tab session and native beforeunload specs
        env:
          CADMUS_TEST_ENGINE: chrome
        run: >-
          bun packages/web-app/scripts/test-ui.ts
          tests/flows/session-tabs.spec.ts
          tests/desktop/session-tabs.spec.ts
          tests/flows/session-signout.spec.ts
          tests/desktop/session-signout.spec.ts
          tests/flows/beforeunload-native.spec.ts

      # The static-assets CSP (public/_headers) is only known to be enforced, and
      # violations only known to be reported, by real Chromium.
      - name: Run CSP headers and violations spec
        env:
          CADMUS_TEST_ENGINE: chrome
        run: >-
          bun packages/web-app/scripts/test-ui.ts
          tests/flows/csp.spec.ts

      # The synthetic soul-edit beforeunload test in profile.spec.ts is skipped
      # on Obscura, where it fails intermittently, so it runs here on real
      # Chromium. It is selected by its title (-g) in its own step so the
      # filter cannot drop the specs above.
      - name: Run soul-edit beforeunload test
        env:
          CADMUS_TEST_ENGINE: chrome
        run: >-
          bun packages/web-app/scripts/test-ui.ts
          tests/flows/profile.spec.ts
          -g "beforeunload warns only while soul edits differ from baseline"

      # The real-ceremony passkey specs use Chrome's virtual authenticator
      # (CDP WebAuthn) against the real worker and skip themselves on every
      # other engine, so no other job runs them. Last, so a failure here does
      # not hide the steps above. The list reporter prints each test and
      # attempt by name, and the step is bounded so a hang fails visibly.
      - name: Run real-ceremony passkey specs
        timeout-minutes: 12
        env:
          CADMUS_TEST_ENGINE: chrome
          CADMUS_REAL_SESSION_HARNESS: "1"
        run: >-
          bun packages/web-app/scripts/test-ui.ts
          tests/desktop/passkeys-real.spec.ts
          tests/flows/passkeys-real.spec.ts
          --reporter=list

      # Same pattern and caveats as the ui job: failed attempts only (a retry
      # pass keeps its first-attempt trace), dev values only, no repository
      # secrets. Playwright empties test-results at the start of each run, so
      # this holds the output of the last Chrome run that executed.
      - name: Upload traces of failed Chrome attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-chrome-failed-attempt-traces
          path: |
            packages/web-app/test-results/**/trace.zip
            packages/web-app/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
